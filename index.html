<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FocusFlow</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 40px;
            text-align: center;
        }

        #activity-box {
            margin-top: 20px;
            padding: 20px;
            border: 2px solid #ddd;
            border-radius: 8px;
            min-height: 40px;
            font-size: 1.2rem;
        }

        button {
            padding: 12px 20px;
            font-size: 1rem;
            border: none;
            border-radius: 6px;
            background-color: #0078ff;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background-color: #005fcc;
        }
    </style>
</head>

<body>

    <h1>FocusFlow</h1>

    <button onclick="getActivity()">Få aktivitet</button>

    <div id="activity-box"></div>

    <script>
        const activities = [
            "Tag 3 dybe vejrtrækninger",
            "Stræk nakken i 20 sekunder",
            "Rejs dig og ryst skuldrene",
            "Fokuser på et punkt i rummet i 10 sekunder",
            "Luk øjnene og slap af i kæben",
            "Tag 5 langsomme vejrtrækninger",
            "Rul skuldrene 5 gange bagud"
        ];

        function getActivity() {
            const random = Math.floor(Math.random() * activities.length);
            document.getElementById("activity-box").textContent = activities[random];
        }
    </script>

</body>
</html>
