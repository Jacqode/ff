<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <title>FocusFlow</title>
</head>
<body>

<!-- Header (fast øverst) -->
<div id="header" style="
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    background: white;
    padding: 10px 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #eee;
    z-index: 20;
">
    <div id="greeting">Hej ukendt</div>
    <div id="teamLabel">Team: Ingen</div>
</div>

<!-- Aktivitetskort (fast under header) -->
<div id="activityBox" style="
    position: fixed;
    top: 56px; /* højde af header + lidt luft */
    left: 0;
    right: 0;
    background: white;
    padding: 12px;
    border-bottom: 1px solid #eee;
    z-index: 19;
">
    <!-- Knap: Få aktivitet -->
    <div style="margin-bottom:8px;">
        <button id="getActivityBtn">Få aktivitet</button>
    </div>

    <!-- Stor tekst: Aktivitetstitel -->
    <div>
        <h1 id="activityText" style="margin:6px 0 10px 0; font-size:1.1rem;">Få aktivitet</h1>
    </div>

    <!-- Knap: Færdig (lige under aktiviteten) -->
    <div style="margin-bottom:8px;">
        <button id="doneBtn">Færdig</button>
    </div>

    <!-- Microfeedback (lige under færdig knappen) -->
    <div id="micro" style="display:none; color:#0a0; font-weight:600;">Godt gået – fortsæt den gode vane!</div>
</div>

<!-- Hovedindhold: flyttet ned så det ikke ligger under de faste elementer -->
<div id="main" style="margin-top: 170px; padding: 12px;">

    <!-- Feed (omdøbt) -->
    <h3>Dit teams seneste aktiviter:</h3>
    <div id="feed"></div>

    <!-- Stats -->
    <h3>Stats</h3>
    <div id="stats">
        <div>Pauser i dag: <span id="todayCount">0</span></div>
        <div>Pauser i alt: <span id="totalCount">0</span></div>
    </div>

    <!-- Team Stats (vises hvis team valgt) -->
    <h3>Team</h3>
    <div id="teamBox">
        <div>Teamnavn: <span id="teamName">Ingen</span></div>
        <div>Team‑pauser i dag: <span id="teamToday">0</span></div>
        <div>Team‑pauser i alt: <span id="teamTotal">0</span></div>
    </div>

    <!-- Indstillinger -->
    <h3>Indstillinger</h3>
    <label>Navn: <input id="nameInput" placeholder="Skriv navn"></label><br><br>
    <label>Teamnavn: <input id="teamInput" placeholder="Teamnavn"></label><br><br>
    <label>Minutter mellem påmindelser:
        <input id="reminderInput" type="number" min="5" max="180" value="30">
    </label>

</div>

<script>
// ----------------------
// DATA
// ----------------------
const activities = [
    "Stå‑kat – rund ryggen frem og svaj den let tilbage, skift langsomt mellem de to. 🐈",
    "Skulderrul bagud – store cirkler for at løsne spændinger. 🌀",
    "Læg‑løft – op på tæerne og ned igen. ⬆️",
    "Ryst kroppen – slip spændinger i arme og ben. 💃"
];

const FEED_DISPLAY_LIMIT = 5; // vis kun de seneste 5 i feedet

let state = {
    name: localStorage.getItem("name") || "ukendt",
    todayCount: Number(localStorage.getItem("todayCount") || 0),
    totalCount: Number(localStorage.getItem("totalCount") || 0),
    reminderMinutes: Number(localStorage.getItem("reminderMinutes") || 30),
    feed: JSON.parse(localStorage.getItem("feed") || "[]"),
    lastPulse: localStorage.getItem("lastPulse") || "–",
    team: localStorage.getItem("team") || "",
    teamToday: Number(localStorage.getItem("teamToday") || 0),
    teamTotal: Number(localStorage.getItem("teamTotal") || 0)
};

// ----------------------
// INIT
// ----------------------
function initUI() {
    document.getElementById("greeting").textContent = "Hej " + state.name;
    document.getElementById("todayCount").textContent = state.todayCount;
    document.getElementById("totalCount").textContent = state.totalCount;
    document.getElementById("lastPulse").textContent = state.lastPulse;
    document.getElementById("teamName").textContent = state.team || "Ingen";
    document.getElementById("teamToday").textContent = state.teamToday;
    document.getElementById("teamTotal").textContent = state.teamTotal;
    document.getElementById("teamLabel").textContent = "Team: " + (state.team || "Ingen");
    document.getElementById("reminderInput").value = state.reminderMinutes;
    renderFeed();
}
initUI();

// ----------------------
// HJÆLPEFUNKTIONER
// ----------------------
function getRandomActivity() {
    return activities[Math.floor(Math.random() * activities.length)];
}

function showMicro(message) {
    const m = document.getElementById("micro");
    m.textContent = message || "Godt gået – fortsæt den gode vane!";
    m.style.display = "block";
    // vis i 6 sekunder
    setTimeout(() => m.style.display = "none", 6000);
}

/**
 * Render feed: vis kun de seneste FEED_DISPLAY_LIMIT entries.
 * state.feed er stadig fuld historik; vi begrænser kun visningen.
 */
function renderFeed() {
    const feedDiv = document.getElementById("feed");
    feedDiv.innerHTML = "";

    // Tag de første FEED_DISPLAY_LIMIT elementer fra state.feed
    const toShow = state.feed.slice(0, FEED_DISPLAY_LIMIT);

    toShow.forEach(item => {
        const div = document.createElement("div");
        div.textContent = item;
        feedDiv.appendChild(div);
    });

    // Hvis der er flere end limit, vis en lille note
    if (state.feed.length > FEED_DISPLAY_LIMIT) {
        const more = document.createElement("div");
        more.style.marginTop = "8px";
        more.style.color = "#666";
        more.textContent = `Viser ${FEED_DISPLAY_LIMIT} af ${state.feed.length} pauser (nyeste øverst)`;
        feedDiv.appendChild(more);
    }
}

function saveState() {
    localStorage.setItem("name", state.name);
    localStorage.setItem("todayCount", state.todayCount);
    localStorage.setItem("totalCount", state.totalCount);
    localStorage.setItem("reminderMinutes", state.reminderMinutes);
    localStorage.setItem("feed", JSON.stringify(state.feed));
    localStorage.setItem("lastPulse", state.lastPulse);
    localStorage.setItem("team", state.team);
    localStorage.setItem("teamToday", state.teamToday);
    localStorage.setItem("teamTotal", state.teamTotal);
}

// ----------------------
// Knapper: Få aktivitet (kun viser aktivitet)
document.getElementById("getActivityBtn").onclick = () => {
    const activity = getRandomActivity();
    document.getElementById("activityText").textContent = activity;
};

// ----------------------
// Knap: Færdig (registrerer pause)
document.getElementById("doneBtn").onclick = () => {
    const activity = document.getElementById("activityText").textContent || getRandomActivity();

    // registrer pause
    state.todayCount++;
    state.totalCount++;
    document.getElementById("todayCount").textContent = state.todayCount;
    document.getElementById("totalCount").textContent = state.totalCount;

    // team stats (hvis team sat)
    if (state.team) {
        state.teamToday++;
        state.teamTotal++;
        document.getElementById("teamToday").textContent = state.teamToday;
        document.getElementById("teamTotal").textContent = state.teamTotal;
    }

    // feed: nyeste øverst
    const time = new Date().toLocaleTimeString("da-DK", {hour: "2-digit", minute: "2-digit"});
    const entry = `${state.name}: ${activity} ${time}`;
    state.feed.unshift(entry);

    // valgfrit: begræns intern historik til fx 200 entries for at undgå uendelig vækst
    const MAX_HISTORY = 200;
    if (state.feed.length > MAX_HISTORY) {
        state.feed = state.feed.slice(0, MAX_HISTORY);
    }

    renderFeed();

    // microfeedback (6s)
    showMicro("Godt gået – fortsæt den gode vane!");

    saveState();
};

// ----------------------
// TRIVSELSPULS (placeholder knapper kan tilføjes senere)
// ----------------------

// ----------------------
// NAVN
document.getElementById("nameInput").value = state.name === "ukendt" ? "" : state.name;
document.getElementById("nameInput").onchange = (e) => {
    state.name = e.target.value || "ukendt";
    document.getElementById("greeting").textContent = "Hej " + state.name;
    saveState();
};

// ----------------------
// TEAM
document.getElementById("teamInput").value = state.team || "";
document.getElementById("teamInput").onchange = (e) => {
    state.team = e.target.value.trim();
    document.getElementById("teamName").textContent = state.team || "Ingen";
    document.getElementById("teamLabel").textContent = "Team: " + (state.team || "Ingen");
    saveState();
};

// ----------------------
// PÅMINDELSER
document.getElementById("reminderInput").onchange = (e) => {
    state.reminderMinutes = Number(e.target.value) || 30;
    saveState();
};

// Diskret notifikation
function notify() {
    const n = document.createElement("div");
    n.textContent = "Tid til en kort pause?";
    n.style.position = "fixed";
    n.style.bottom = "10px";
    n.style.right = "10px";
    n.style.padding = "10px";
    n.style.background = "#eee";
    n.style.border = "1px solid #ddd";
    document.body.appendChild(n);
    setTimeout(() => n.remove(), 5000);
}

setInterval(() => notify(), state.reminderMinutes * 60 * 1000);

// ----------------------
// OFFLINE ROBUSTHED
window.addEventListener("online", () => console.log("Synk til backend her"));
window.addEventListener("offline", () => console.log("Offline – gemmer lokalt"));

</script>

</body>
</html>
