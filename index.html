<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <title>Flow Focus</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial; padding: 20px; max-width: 900px; margin: auto; }
        input[readonly] { background:#eee; border:1px solid #ccc; padding:6px; }
        input, button { padding:6px 8px; margin:6px 0; }
        h1,h2,h3 { margin: 12px 0 6px; }
        hr { margin: 16px 0; }
        #feed div { padding:6px 0; border-bottom:1px solid #f0f0f0; }
        ul { padding-left: 18px; }
    </style>
</head>
<body>

<h1>Flow Focus</h1>

<!-- USER INFO -->
<div>
    <label>Navn:
        <input id="nameInput" placeholder="Dit navn">
    </label>
</div>

<div>
    <label>Organisation:
        <input id="orgInput" readonly>
    </label>
</div>

<div>
    <label>Team:
        <input id="teamInput" readonly>
    </label>
</div>

<hr>

<!-- ACTIVITY -->
<h2>Aktivitet</h2>
<button id="getActivityBtn">Få aktivitet</button>
<div id="activityText">Ingen aktivitet endnu</div>
<br>
<button id="doneBtn">Færdig</button>
<div id="micro" style="display:none; margin-top:8px; color:green;">Godt gået!</div>

<hr>

<!-- STATS -->
<h2>Dine stats</h2>
<div>Pauser i dag: <span id="todayCount">0</span></div>
<div>Pauser i alt: <span id="totalCount">0</span></div>

<h3>Pauser over tid</h3>
<canvas id="userChart" width="400" height="200"></canvas>

<hr>

<!-- TEAM STATS -->
<h2>Team stats</h2>
<div>Team pauser i dag: <span id="teamToday">0</span></div>
<div>Team pauser i alt: <span id="teamTotal">0</span></div>

<hr>

<!-- FEED -->
<h2>Team feed</h2>
<div id="feed"></div>

<hr>

<!-- ADMIN OVERBLIK (midlertidigt) -->
<h2>Organisationer</h2>
<ul id="orgList"></ul>

<h2>Teams</h2>
<ul id="teamList"></ul>

<h2>Brugere</h2>
<ul id="userList"></ul>

<script>
// ----------------------
// DATA SERVICE (localStorage)
// ----------------------
const Data = {
    getOrgs() { return JSON.parse(localStorage.getItem("orgs") || "[]"); },
    saveOrg(org) {
        const orgs = this.getOrgs();
        const idx = orgs.findIndex(o => o.id === org.id);
        if (idx === -1) orgs.push(org); else orgs[idx] = org;
        localStorage.setItem("orgs", JSON.stringify(orgs));
    },

    getTeams() { return JSON.parse(localStorage.getItem("teams") || "[]"); },
    saveTeam(team) {
        const teams = this.getTeams();
        const idx = teams.findIndex(t => t.id === team.id);
        if (idx === -1) teams.push(team); else teams[idx] = team;
        localStorage.setItem("teams", JSON.stringify(teams));
    },

    getUsers() { return JSON.parse(localStorage.getItem("users") || "[]"); },
    saveUser(user) {
        const users = this.getUsers();
        const idx = users.findIndex(u => u.id === user.id);
        if (idx === -1) users.push(user); else users[idx] = user;
        localStorage.setItem("users", JSON.stringify(users));
        localStorage.setItem("currentUserId", user.id);
    },
    getCurrentUser() {
        const id = localStorage.getItem("currentUserId");
        if (!id) return null;
        return this.getUsers().find(u => u.id === id) || null;
    },

    addEvent(event) {
        const events = JSON.parse(localStorage.getItem("events") || "[]");
        events.unshift(event);
        localStorage.setItem("events", JSON.stringify(events));
    },
    getEvents() { return JSON.parse(localStorage.getItem("events") || "[]"); }
};

// ----------------------
// URL ONBOARDING
// ----------------------
function parseQuery() {
    const params = {};
    window.location.search.replace(/^\?/, "").split("&").forEach(p => {
        if (!p) return;
        const [k, v] = p.split("=");
        params[decodeURIComponent(k)] = decodeURIComponent(v || "");
    });
    return params;
}

let user = Data.getCurrentUser();

if (!user) {
    const q = parseQuery();
    const orgId = q.org || "org_default";
    const teamId = q.team || "team_default";

    let org = Data.getOrgs().find(o => o.id === orgId);
    if (!org) {
        org = { id: orgId, name: q.orgName || "Ukendt organisation" };
        Data.saveOrg(org);
    }

    let team = Data.getTeams().find(t => t.id === teamId && t.orgId === orgId);
    if (!team) {
        team = { id: teamId, orgId: orgId, name: q.teamName || "Standard team" };
        Data.saveTeam(team);
    }

    user = {
        id: "user_" + Math.random().toString(36).slice(2),
        name: "ukendt",
        orgId: orgId,
        teamId: teamId
    };
    Data.saveUser(user);
}

// ----------------------
// HELPER FUNCTIONS (robust)
// ----------------------
function sameDay(a, b) {
    const d1 = new Date(a);
    const d2 = new Date(b);
    return d1.getFullYear() === d2.getFullYear()
        && d1.getMonth() === d2.getMonth()
        && d1.getDate() === d2.getDate();
}

// Hent de sidste n hverdage (man-fre) uden risiko for uendelig løkke
function getLastNDays(n) {
    const days = [];
    let offset = 0;
    const today = new Date();

    while (days.length < n) {
        const d = new Date(today);
        d.setDate(today.getDate() - offset);
        offset++;

        const dayOfWeek = d.getDay(); // 0 = søndag, 6 = lørdag
        if (dayOfWeek === 0 || dayOfWeek === 6) continue;

        // push en ny Date-instans (kun år/måned/dato)
        days.push(new Date(d.getFullYear(), d.getMonth(), d.getDate()));
    }

    return days.reverse();
}

function countPausesPerDay(userId, days) {
    const events = Data.getEvents().filter(e => e.userId === userId);

    return days.map(day =>
        events.filter(e => sameDay(e.createdAt, day)).length
    );
}

// ----------------------
// RENDER CHART
// ----------------------
let userChart = null;

function renderUserChart() {
    const days = getLastNDays(10);
    const counts = countPausesPerDay(user.id, days);

    const labels = days.map(d =>
        d.toLocaleDateString("da-DK", { weekday: "short", day: "numeric", month: "numeric" })
    );

    const ctx = document.getElementById("userChart").getContext("2d");

    if (userChart) userChart.destroy();

    userChart = new Chart(ctx, {
        type: "line",
        data: {
            labels: labels,
            datasets: [{
                label: "Pauser pr. dag",
                data: counts,
                borderColor: "#007bff",
                backgroundColor: "rgba(0,123,255,0.15)",
                tension: 0.25,
                fill: true,
                pointRadius: 4,
                pointBackgroundColor: "#007bff"
            }]
        },
        options: {
            responsive: false,
            maintainAspectRatio: false,
            scales: {
                x: {
                    title: { display: true, text: "Dato (man–fre)" },
                    ticks: { maxRotation: 0, autoSkip: false }
                },
                y: {
                    title: { display: true, text: "Pauser" },
                    beginAtZero: true,
                    ticks: { stepSize: 1 }
                }
            },
            plugins: {
                legend: { display: false }
            }
        }
    });
}

// ----------------------
// RENDER UI
// ----------------------
function renderStats() {
    const events = Data.getEvents();
    const now = Date.now();

    const userEvents = events.filter(e => e.userId === user.id);
    const userToday = userEvents.filter(e => sameDay(e.createdAt, now));

    const teamEvents = events.filter(e => e.teamId === user.teamId);
    const teamToday = teamEvents.filter(e => sameDay(e.createdAt, now));

    document.getElementById("todayCount").textContent = userToday.length;
    document.getElementById("totalCount").textContent = userEvents.length;
    document.getElementById("teamToday").textContent = teamToday.length;
    document.getElementById("teamTotal").textContent = teamEvents.length;
}

function renderFeed() {
    const feed = document.getElementById("feed");
    feed.innerHTML = "";

    const events = Data.getEvents().filter(e => e.teamId === user.teamId).slice(0, 10);

    events.forEach(e => {
        const div = document.createElement("div");
        const time = new Date(e.createdAt).toLocaleTimeString("da-DK", { hour: "2-digit", minute: "2-digit" });
        div.textContent = `${e.activity} – ${time}`;
        feed.appendChild(div);
    });
}

function renderAdmin() {
    const orgList = document.getElementById("orgList");
    const teamList = document.getElementById("teamList");
    const userList = document.getElementById("userList");

    orgList.innerHTML = "";
    teamList.innerHTML = "";
    userList.innerHTML = "";

    Data.getOrgs().forEach(o => {
        const li = document.createElement("li");
        li.textContent = `${o.id} – ${o.name}`;
        orgList.appendChild(li);
    });

    Data.getTeams().forEach(t => {
        const li = document.createElement("li");
        li.textContent = `${t.id} – ${t.name} (org: ${t.orgId})`;
        teamList.appendChild(li);
    });

    Data.getUsers().forEach(u => {
        const li = document.createElement("li");
        li.textContent = `${u.id} – ${u.name} (team: ${u.teamId}, org: ${u.orgId})`;
        userList.appendChild(li);
    });
}

function initUI() {
    document.getElementById("nameInput").value = user.name === "ukendt" ? "" : user.name;

    const org = Data.getOrgs().find(o => o.id === user.orgId);
    document.getElementById("orgInput").value = org ? org.name : "";

    const team = Data.getTeams().find(t => t.id === user.teamId);
    document.getElementById("teamInput").value = team ? team.name : "";

    renderStats();
    renderFeed();
    renderAdmin();
    renderUserChart();
}
initUI();

// ----------------------
// HANDLERS
// ----------------------
document.getElementById("nameInput").onchange = e => {
    user.name = e.target.value || "ukendt";
    Data.saveUser(user);
    renderAdmin();
};

document.getElementById("getActivityBtn").onclick = () => {
    document.getElementById("activityText").textContent = [
        "Stå‑kat",
        "Skulderrul",
        "Læg‑løft",
        "Ryst kroppen",
        "Stræk arme"
    ][Math.floor(Math.random() * 5)];
};

document.getElementById("doneBtn").onclick = () => {
    const activity = document.getElementById("activityText").textContent || "Pause";

    Data.addEvent({
        id: crypto.randomUUID ? crypto.randomUUID() : ("id_" + Math.random().toString(36).slice(2)),
        orgId: user.orgId,
        teamId: user.teamId,
        userId: user.id,
        activity,
        createdAt: Date.now()
    });

    document.getElementById("micro").style.display = "block";
    setTimeout(() => document.getElementById("micro").style.display = "none", 2000);

    renderStats();
    renderFeed();
    renderAdmin();
    renderUserChart();
};

// ----------------------
// Optional: helper to clear local test data (uncomment to use)
// ----------------------

//     localStorage.removeItem('currentUserId');
//     location.reload();
// }
</script>

</body>
</html>
