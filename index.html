<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <title>Flow Focus</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<h1>Flow Focus</h1>

<!-- USER INFO -->
<div>
    <label>Navn:
        <input id="nameInput" placeholder="Dit navn">
    </label>
</div>

<div>
    <label>Organisation:
        <input id="orgInput" readonly style="background:#eee;">
    </label>
</div>

<div>
    <label>Team:
        <input id="teamInput" readonly style="background:#eee;">
    </label>
</div>

<hr>

<!-- ACTIVITY -->
<h2>Aktivitet</h2>
<button id="getActivityBtn">Få aktivitet</button>
<div id="activityText">Ingen aktivitet endnu</div>
<button id="doneBtn">Færdig</button>
<div id="micro" style="display:none;">Godt gået!</div>

<hr>

<!-- STATS -->
<h2>Dine stats</h2>
<div>Pauser i dag: <span id="todayCount">0</span></div>
<div>Pauser i alt: <span id="totalCount">0</span></div>

<h3>Pauser over tid</h3>
<canvas id="pauseChart" width="400" height="200"></canvas>

<h2>Team stats</h2>
<div>Team pauser i dag: <span id="teamToday">0</span></div>
<div>Team pauser i alt: <span id="teamTotal">0</span></div>

<hr>

<!-- FEED -->
<h2>Team feed</h2>
<div id="feed"></div>

<hr>

<!-- ADMIN OVERBLIK (midlertidigt) -->
<h2>Organisationer</h2>
<ul id="orgList"></ul>

<h2>Teams</h2>
<ul id="teamList"></ul>

<h2>Brugere</h2>
<ul id="userList"></ul>

<script>
// ----------------------
// DATA SERVICE
// ----------------------
const Data = {
    getOrgs() { return JSON.parse(localStorage.getItem("orgs") || "[]"); },
    saveOrg(org) {
        const orgs = this.getOrgs();
        const idx = orgs.findIndex(o => o.id === org.id);
        if (idx === -1) orgs.push(org); else orgs[idx] = org;
        localStorage.setItem("orgs", JSON.stringify(orgs));
    },

    getTeams() { return JSON.parse(localStorage.getItem("teams") || "[]"); },
    saveTeam(team) {
        const teams = this.getTeams();
        const idx = teams.findIndex(t => t.id === team.id);
        if (idx === -1) teams.push(team); else teams[idx] = team;
        localStorage.setItem("teams", JSON.stringify(teams));
    },

    getUsers() { return JSON.parse(localStorage.getItem("users") || "[]"); },
    saveUser(user) {
        const users = this.getUsers();
        const idx = users.findIndex(u => u.id === user.id);
        if (idx === -1) users.push(user); else users[idx] = user;
        localStorage.setItem("users", JSON.stringify(users));
        localStorage.setItem("currentUserId", user.id);
    },
    getCurrentUser() {
        const id = localStorage.getItem("currentUserId");
        if (!id) return null;
        return this.getUsers().find(u => u.id === id) || null;
    },

    addEvent(event) {
        const events = JSON.parse(localStorage.getItem("events") || "[]");
        events.unshift(event);
        localStorage.setItem("events", JSON.stringify(events));
    },
    getEvents() { return JSON.parse(localStorage.getItem("events") || "[]"); }
};

// ----------------------
// URL ONBOARDING
// ----------------------
function parseQuery() {
    const params = {};
    window.location.search.replace(/^\?/, "").split("&").forEach(p => {
        if (!p) return;
        const [k, v] = p.split("=");
        params[decodeURIComponent(k)] = decodeURIComponent(v || "");
    });
    return params;
}

let user = Data.getCurrentUser();

if (!user) {
    const q = parseQuery();
    const orgId = q.org || "org_default";
    const teamId = q.team || "team_default";

    let org = Data.getOrgs().find(o => o.id === orgId);
    if (!org) {
        org = { id: orgId, name: q.orgName || "Ukendt organisation" };
        Data.saveOrg(org);
    }

    let team = Data.getTeams().find(t => t.id === teamId && t.orgId === orgId);
    if (!team) {
        team = { id: teamId, orgId: orgId, name: q.teamName || "Standard team" };
        Data.saveTeam(team);
    }

    user = {
        id: "user_" + Math.random().toString(36).slice(2),
        name: "ukendt",
        orgId,
        teamId
    };
    Data.saveUser(user);
}

// ----------------------
// RENDER FUNKTIONER
// ----------------------
function sameDay(a, b) {
    const d1 = new Date(a);
    const d2 = new Date(b);
    return d1.toDateString() === d2.toDateString();
}

function renderStats() {
    const events = Data.getEvents();
    const now = Date.now();

    const userEvents = events.filter(e => e.userId === user.id);
    const userToday = userEvents.filter(e => sameDay(e.createdAt, now));

    const teamEvents = events.filter(e => e.teamId === user.teamId);
    const teamToday = teamEvents.filter(e => sameDay(e.createdAt, now));

    todayCount.textContent = userToday.length;
    totalCount.textContent = userEvents.length;
    teamToday.textContent = teamToday.length;
    teamTotal.textContent = teamEvents.length;
}

function renderFeed() {
    feed.innerHTML = "";
    Data.getEvents()
        .filter(e => e.teamId === user.teamId)
        .slice(0, 5)
        .forEach(e => {
            const div = document.createElement("div");
            div.textContent = `${e.activity} – ${new Date(e.createdAt).toLocaleTimeString("da-DK")}`;
            feed.appendChild(div);
        });
}

function renderAdmin() {
    orgList.innerHTML = "";
    teamList.innerHTML = "";
    userList.innerHTML = "";

    Data.getOrgs().forEach(o => orgList.innerHTML += `<li>${o.id} – ${o.name}</li>`);
    Data.getTeams().forEach(t => teamList.innerHTML += `<li>${t.id} – ${t.name}</li>`);
    Data.getUsers().forEach(u => userList.innerHTML += `<li>${u.id} – ${u.name}</li>`);
}

function initUI() {
    nameInput.value = user.name === "ukendt" ? "" : user.name;
    orgInput.value = Data.getOrgs().find(o => o.id === user.orgId)?.name || "";
    teamInput.value = Data.getTeams().find(t => t.id === user.teamId)?.name || "";

    renderStats();
    renderFeed();
    renderAdmin();
}
initUI();

// ----------------------
// HANDLERS
// ----------------------
nameInput.onchange = e => {
    user.name = e.target.value || "ukendt";
    Data.saveUser(user);
    renderAdmin();
};

getActivityBtn.onclick = () => {
    activityText.textContent = ["Stå‑kat","Skulderrul","Læg‑løft","Ryst kroppen"][Math.floor(Math.random()*4)];
};

doneBtn.onclick = () => {
    Data.addEvent({
        id: crypto.randomUUID(),
        orgId: user.orgId,
        teamId: user.teamId,
        userId: user.id,
        activity: activityText.textContent,
        createdAt: Date.now()
    });

    micro.style.display = "block";
    setTimeout(() => micro.style.display = "none", 2000);

    renderStats();
    renderFeed();
    renderAdmin();
};
</script>

<!-- GRAF (ISOLERET) -->
<script>
(function () {
    function lastWeekdays(n) {
        const days = [];
        let offset = 0;
        const today = new Date();

        while (days.length < n) {
            const d = new Date(today);
            d.setDate(today.getDate() - offset++);
            if (d.getDay() === 0 || d.getDay() === 6) continue;
            days.push(new Date(d.getFullYear(), d.getMonth(), d.getDate()));
        }
        return days.reverse();
    }

    window.addEventListener("load", () => {
        if (!window.Data || !window.user) return;

        const days = lastWeekdays(10);
        const events = Data.getEvents().filter(e => e.userId === user.id);

        const counts = days.map(day =>
            events.filter(e => new Date(e.createdAt).toDateString() === day.toDateString()).length
        );

        new Chart(pauseChart, {
            type: "line",
            data: {
                labels: days.map(d => d.toLocaleDateString("da-DK",{weekday:"short",day:"numeric"})),
                datasets: [{
                    data: counts,
                    borderColor: "#007bff",
                    backgroundColor: "rgba(0,123,255,0.15)",
                    tension: 0.3,
                    fill: true
                }]
            },
            options: {
                plugins: { legend: { display: false } },
                scales: { y: { beginAtZero: true } }
            }
        });
    });
})();
</script>

</body>
</html>
