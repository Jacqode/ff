<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <title>Flow Focus</title>
</head>
<body>

<h1>Flow Focus</h1>

<!-- USER INFO -->
<div>
    <label>Navn:
        <input id="nameInput" placeholder="Dit navn">
    </label>
</div>

<div>
    <label>Organisation:
        <input id="orgInput" placeholder="Organisation">
    </label>
</div>

<div>
    <label>Team:
        <select id="teamSelect"></select>
    </label>
</div>

<hr>

<!-- ACTIVITY -->
<h2>Aktivitet</h2>
<button id="getActivityBtn">Få aktivitet</button>
<div id="activityText">Ingen aktivitet endnu</div>
<button id="doneBtn">Færdig</button>
<div id="micro" style="display:none;">Godt gået!</div>

<hr>

<!-- STATS -->
<h2>Dine stats</h2>
<div>Pauser i dag: <span id="todayCount">0</span></div>
<div>Pauser i alt: <span id="totalCount">0</span></div>

<h2>Team stats</h2>
<div>Team pauser i dag: <span id="teamToday">0</span></div>
<div>Team pauser i alt: <span id="teamTotal">0</span></div>

<hr>

<!-- FEED -->
<h2>Team feed</h2>
<div id="feed"></div>

<hr>

<!-- ADMIN OVERBLIK (midlertidigt) -->
<h2>Organisationer</h2>
<ul id="orgList"></ul>

<h2>Teams</h2>
<ul id="teamList"></ul>

<h2>Brugere</h2>
<ul id="userList"></ul>

<script>
// ----------------------
// DATA SERVICE
// ----------------------
const Data = {
    getOrgs() {
        return JSON.parse(localStorage.getItem("orgs") || "[]");
    },
    saveOrg(org) {
        const orgs = this.getOrgs();
        const idx = orgs.findIndex(o => o.id === org.id);
        if (idx === -1) orgs.push(org); else orgs[idx] = org;
        localStorage.setItem("orgs", JSON.stringify(orgs));
    },

    getTeams() {
        return JSON.parse(localStorage.getItem("teams") || "[]");
    },
    saveTeam(team) {
        const teams = this.getTeams();
        const idx = teams.findIndex(t => t.id === team.id);
        if (idx === -1) teams.push(team); else teams[idx] = team;
        localStorage.setItem("teams", JSON.stringify(teams));
    },

    getUsers() {
        return JSON.parse(localStorage.getItem("users") || "[]");
    },
    saveUser(user) {
        const users = this.getUsers();
        const idx = users.findIndex(u => u.id === user.id);
        if (idx === -1) users.push(user); else users[idx] = user;
        localStorage.setItem("users", JSON.stringify(users));
        localStorage.setItem("currentUserId", user.id);
    },
    getCurrentUser() {
        const id = localStorage.getItem("currentUserId");
        if (!id) return null;
        return this.getUsers().find(u => u.id === id) || null;
    },

    addEvent(event) {
        const events = JSON.parse(localStorage.getItem("events") || "[]");
        events.unshift(event);
        localStorage.setItem("events", JSON.stringify(events));
    },
    getEvents() {
        return JSON.parse(localStorage.getItem("events") || "[]");
    }
};

// ----------------------
// URL ONBOARDING
// ----------------------
function parseQuery() {
    const params = {};
    window.location.search.replace(/^\?/, "").split("&").forEach(p => {
        if (!p) return;
        const [k, v] = p.split("=");
        params[decodeURIComponent(k)] = decodeURIComponent(v || "");
    });
    return params;
}

let user = Data.getCurrentUser();

if (!user) {
    const q = parseQuery();
    const orgId = q.org || "org_default";
    const teamId = q.team || "team_default";

    let org = Data.getOrgs().find(o => o.id === orgId);
    if (!org) {
        org = { id: orgId, name: q.orgName || "Min organisation" };
        Data.saveOrg(org);
    }

    let team = Data.getTeams().find(t => t.id === teamId && t.orgId === orgId);
    if (!team) {
        team = { id: teamId, orgId: orgId, name: q.teamName || "Standard team" };
        Data.saveTeam(team);
    }

    user = {
        id: "user_" + Math.random().toString(36).slice(2),
        name: "ukendt",
        orgId: orgId,
        teamId: teamId
    };
    Data.saveUser(user);
}

// ----------------------
// RENDER FUNKTIONER
// ----------------------
function renderTeamSelect() {
    const select = document.getElementById("teamSelect");
    const teams = Data.getTeams().filter(t => t.orgId === user.orgId);

    select.innerHTML = "";
    teams.forEach(t => {
        const opt = document.createElement("option");
        opt.value = t.id;
        opt.textContent = t.name;
        select.appendChild(opt);
    });

    select.value = user.teamId;
}

function sameDay(a, b) {
    const d1 = new Date(a);
    const d2 = new Date(b);
    return d1.toDateString() === d2.toDateString();
}

function renderStats() {
    const events = Data.getEvents();
    const now = Date.now();

    const userEvents = events.filter(e => e.userId === user.id);
    const userToday = userEvents.filter(e => sameDay(e.createdAt, now));

    const teamEvents = events.filter(e => e.teamId === user.teamId);
    const teamToday = teamEvents.filter(e => sameDay(e.createdAt, now));

    document.getElementById("todayCount").textContent = userToday.length;
    document.getElementById("totalCount").textContent = userEvents.length;
    document.getElementById("teamToday").textContent = teamToday.length;
    document.getElementById("teamTotal").textContent = teamEvents.length;
}

function renderFeed() {
    const feed = document.getElementById("feed");
    feed.innerHTML = "";

    const events = Data.getEvents().filter(e => e.teamId === user.teamId).slice(0, 5);

    events.forEach(e => {
        const div = document.createElement("div");
        div.textContent = `${e.activity} – ${new Date(e.createdAt).toLocaleTimeString("da-DK")}`;
        feed.appendChild(div);
    });
}

function renderAdmin() {
    const orgList = document.getElementById("orgList");
    const teamList = document.getElementById("teamList");
    const userList = document.getElementById("userList");

    orgList.innerHTML = "";
    teamList.innerHTML = "";
    userList.innerHTML = "";

    Data.getOrgs().forEach(o => {
        const li = document.createElement("li");
        li.textContent = `${o.id} – ${o.name}`;
        orgList.appendChild(li);
    });

    Data.getTeams().forEach(t => {
        const li = document.createElement("li");
        li.textContent = `${t.id} – ${t.name} (org: ${t.orgId})`;
        teamList.appendChild(li);
    });

    Data.getUsers().forEach(u => {
        const li = document.createElement("li");
        li.textContent = `${u.id} – ${u.name} (team: ${u.teamId}, org: ${u.orgId})`;
        userList.appendChild(li);
    });
}

function initUI() {
    document.getElementById("nameInput").value = user.name === "ukendt" ? "" : user.name;
    document.getElementById("orgInput").value = Data.getOrgs().find(o => o.id === user.orgId)?.name || "";
    renderTeamSelect();
    renderStats();
    renderFeed();
    renderAdmin();
}
initUI();

// ----------------------
// HANDLERS
// ----------------------
document.getElementById("nameInput").onchange = e => {
    user.name = e.target.value || "ukendt";
    Data.saveUser(user);
    renderAdmin();
};

document.getElementById("orgInput").onchange = e => {
    const name = e.target.value.trim();
    if (!name) return;

    let org = Data.getOrgs().find(o => o.name === name);
    if (!org) {
        org = { id: "org_" + name.toLowerCase().replace(/\s+/g, "_"), name };
        Data.saveOrg(org);
    }

    user.orgId = org.id;
    Data.saveUser(user);
    renderTeamSelect();
    renderStats();
    renderFeed();
    renderAdmin();
};

document.getElementById("teamSelect").onchange = e => {
    user.teamId = e.target.value;
    Data.saveUser(user);
    renderStats();
    renderFeed();
    renderAdmin();
};

document.getElementById("getActivityBtn").onclick = () => {
    document.getElementById("activityText").textContent = [
        "Stå‑kat",
        "Skulderrul",
        "Læg‑løft",
        "Ryst kroppen"
    ][Math.floor(Math.random() * 4)];
};

document.getElementById("doneBtn").onclick = () => {
    const activity = document.getElementById("activityText").textContent;

    Data.addEvent({
        id: crypto.randomUUID(),
        orgId: user.orgId,
        teamId: user.teamId,
        userId: user.id,
        activity,
        createdAt: Date.now()
    });

    document.getElementById("micro").style.display = "block";
    setTimeout(() => document.getElementById("micro").style.display = "none", 3000);

    renderStats();
    renderFeed();
    renderAdmin();
};
</script>

</body>
</html>
